name: Worker CI

on:
  pull_request:
    branches: [main, 'codex/phase1d-protection-drill-*']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.17
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Worker security tests
        run: npm run test:worker

      - name: Run community boundary tests
        run: npm run test:community

      - name: Bundle production Worker
        run: npm run worker:check

      - name: Bundle isolated staging Worker
        run: npm run worker:check:staging

      - name: Bundle Community, admin and production release Workers
        run: |
          npm run community:check
          npm run admin:check
          npm run content:deployer:check
          npm run content:broker:check

  astro-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.17
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            astro/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix astro

      - name: Verify Astro
        run: npm run verify --prefix astro

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.17
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify migrations, idempotency, and RLS
        run: bash scripts/test-supabase-local.sh
