<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pi 第一次会话</title><desc id="desc">在终端中完成安装、登录、只读理解和小范围修改四个步骤。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11151c"/><stop offset="1" stop-color="#202737"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.title{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;font-size:38px;font-weight:750;fill:#f7f7f2}.muted{font-size:18px;fill:#8c95a7}.cmd{font-size:22px;fill:#dfe6f5}.ok{font-size:20px;fill:#71e0ad}.step{opacity:.28;animation:focus 8s ease-in-out infinite}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.cursor{animation:blink 1s steps(1) infinite}@keyframes focus{0%,24%,100%{opacity:.28}5%,20%{opacity:1}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.step{opacity:1;animation:none}.cursor{animation:none}}</style>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="68" cy="56" r="8" fill="#ff6b6b"/><circle cx="96" cy="56" r="8" fill="#f3c969"/><circle cx="124" cy="56" r="8" fill="#65d28d"/>
  <text x="72" y="128" class="title">第一次 Pi 会话：先读，再做，再检查</text>
  <path d="M98 202v390" stroke="#3a4354" stroke-width="3"/><path d="M98 202v390" stroke="#4e83ff" stroke-width="3" stroke-dasharray="96 294"><animate attributeName="stroke-dashoffset" values="0;-390" dur="8s" repeatCount="indefinite"/></path>
  <g class="step"><circle cx="98" cy="218" r="17" fill="#4e83ff" filter="url(#glow)"/><text x="142" y="214" class="muted">01 · INSTALL</text><text x="142" y="252" class="cmd">$ npm install -g --ignore-scripts @earendil-works/pi-coding-agent</text><text x="142" y="284" class="ok">✓ pi 0.84.3 ready</text></g>
  <g class="step s2"><circle cx="98" cy="350" r="17" fill="#4e83ff" filter="url(#glow)"/><text x="142" y="346" class="muted">02 · AUTHENTICATE</text><text x="142" y="384" class="cmd">› /login</text><text x="142" y="416" class="ok">✓ provider and model selected</text></g>
  <g class="step s3"><circle cx="98" cy="482" r="17" fill="#4e83ff" filter="url(#glow)"/><text x="142" y="478" class="muted">03 · READ ONLY</text><text x="142" y="516" class="cmd">› 先不要改文件，解释项目并找到检查命令</text><text x="142" y="548" class="ok">✓ README · package.json · tests</text></g>
  <g class="step s4"><circle cx="98" cy="614" r="17" fill="#4e83ff" filter="url(#glow)"/><text x="142" y="610" class="muted">04 · SMALL CHANGE</text><text x="142" y="648" class="cmd">› 修改后运行检查，并总结 git diff</text><rect class="cursor" x="792" y="627" width="13" height="27" fill="#f7f7f2"/></g>
</svg>
