<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pi 项目上下文堆栈</title><desc id="desc">全局规则、项目规则、引用文件和当前任务逐层进入模型上下文。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f6f0"/><stop offset="1" stop-color="#e8ecf6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity=".12"/></filter></defs>
  <style>text{font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.title{font-size:40px;font-weight:760;fill:#171a21}.eyebrow{font-size:16px;font-weight:700;letter-spacing:3px;fill:#6e7480}.name{font-size:24px;font-weight:720;fill:#1a1d24}.copy{font-size:17px;fill:#626874}.layer{filter:url(#shadow);animation:slide 8s ease-in-out infinite;transform-box:fill-box}.l2{animation-delay:1.2s}.l3{animation-delay:2.4s}.l4{animation-delay:3.6s}.model{animation:model 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes slide{0%,9%,100%{transform:translateX(-14px);opacity:.72}15%,72%{transform:translateX(0);opacity:1}}@keyframes model{0%,48%,100%{transform:scale(.97);opacity:.75}58%,82%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.layer,.model{animation:none;opacity:1}}</style>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="70" y="72" class="eyebrow">CONTEXT ENGINEERING</text><text x="70" y="125" class="title">不是“多说一点”，而是把对的信息放对位置</text>
  <g class="layer" transform="translate(90 194)"><rect width="510" height="82" rx="18" fill="#fff"/><rect width="8" height="82" rx="4" fill="#808996"/><text x="34" y="35" class="name">全局 AGENTS.md</text><text x="34" y="62" class="copy">跨项目通用的个人工作习惯</text></g>
  <g class="layer l2" transform="translate(112 292)"><rect width="510" height="82" rx="18" fill="#fff"/><rect width="8" height="82" rx="4" fill="#4e83ff"/><text x="34" y="35" class="name">项目 AGENTS.md</text><text x="34" y="62" class="copy">命令、目录、边界与验证规则</text></g>
  <g class="layer l3" transform="translate(134 390)"><rect width="510" height="82" rx="18" fill="#fff"/><rect width="8" height="82" rx="4" fill="#9d68e8"/><text x="34" y="35" class="name">@ 相关文件</text><text x="34" y="62" class="copy">这次任务真正需要的源码与测试</text></g>
  <g class="layer l4" transform="translate(156 488)"><rect width="510" height="82" rx="18" fill="#fff"/><rect width="8" height="82" rx="4" fill="#ef7d52"/><text x="34" y="35" class="name">当前请求</text><text x="34" y="62" class="copy">目标、约束与完成标准</text></g>
  <path d="M682 380h118" stroke="#858b97" stroke-width="3" stroke-dasharray="8 9"/><path d="m792 368 22 12-22 12" fill="none" stroke="#858b97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="model" transform="translate(824 250)" filter="url(#shadow)"><rect width="286" height="258" rx="30" fill="#171b24"/><circle cx="143" cy="76" r="37" fill="#4e83ff"/><path d="M126 76h34M143 59v34" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="143" y="150" text-anchor="middle" style="font:740 29px Inter,system-ui;fill:#fff">Pi + Model</text><text x="143" y="188" text-anchor="middle" style="font:17px Inter,system-ui;fill:#aeb7c8">更少噪音</text><text x="143" y="218" text-anchor="middle" style="font:17px Inter,system-ui;fill:#aeb7c8">更明确的下一步</text></g>
  <text x="70" y="653" class="copy">稳定规则长期保存 · 相关文件精确引用 · 临时目标只留在当前请求</text>
</svg>
