<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pi 会话树</title><desc id="desc">会话从主线分出方案 A 和方案 B，并在不同节点间切换。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151d"/><stop offset="1" stop-color="#1a2130"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="travel" d="M156 330H390C470 330 470 220 550 220H952M390 330C470 330 470 466 550 466H952"/></defs>
  <style>text{font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.title{font-size:41px;font-weight:760;fill:#f5f6f8}.eyebrow{font-size:16px;letter-spacing:3px;font-weight:700;fill:#8690a4}.label{font-size:21px;font-weight:700;fill:#f4f6fa}.sub{font-size:16px;fill:#8f99aa}.line{fill:none;stroke:#475166;stroke-width:4}.node{fill:#202839;stroke:#61708d;stroke-width:3}.active{animation:active 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.a2{animation-delay:1.4s}.a3{animation-delay:2.8s}.a4{animation-delay:4.2s}.a5{animation-delay:5.6s}@keyframes active{0%,18%,100%{fill:#202839;stroke:#61708d;transform:scale(1)}5%,13%{fill:#315fcb;stroke:#80a4ff;transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.active{animation:none}}</style>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/><text x="72" y="74" class="eyebrow">SESSION TREE · JSONL</text><text x="72" y="128" class="title">历史不会被抹掉，只是从另一个节点继续</text>
  <path class="line" d="M156 330H390C470 330 470 220 550 220H952"/><path class="line" d="M390 330C470 330 470 466 550 466H952"/>
  <g><circle class="node active" cx="156" cy="330" r="21"/><text x="125" y="382" class="label">任务开始</text></g>
  <g><circle class="node active a2" cx="390" cy="330" r="21"/><text x="350" y="382" class="label">根因确认</text></g>
  <g><circle class="node active a3" cx="550" cy="220" r="21"/><text x="517" y="176" class="label">方案 A</text><text x="496" y="270" class="sub">保持原结构</text></g>
  <g><circle class="node active a4" cx="744" cy="220" r="21"/><text x="699" y="176" class="label">测试失败</text></g>
  <g><circle class="node active a5" cx="550" cy="466" r="21"/><text x="517" y="530" class="label">方案 B</text><text x="486" y="498" class="sub">回到旧节点分支</text></g>
  <g><circle class="node" cx="744" cy="466" r="21"/><text x="703" y="530" class="label">测试通过</text></g><g><circle cx="952" cy="466" r="25" fill="#55d596" filter="url(#glow)"/><path d="m941 466 8 8 15-18" fill="none" stroke="#102018" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="906" y="530" class="label">完成</text></g>
  <circle r="9" fill="#80a4ff" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" keyTimes="0;.48;.52;1" keyPoints="0;.56;.31;1"><mpath href="#travel"/></animateMotion></circle>
  <text x="72" y="645" class="sub">/tree 在同一棵树换枝 · /fork 从旧节点建新会话 · /clone 复制当前分支</text>
</svg>
