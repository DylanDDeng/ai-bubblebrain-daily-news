<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 170 1092 452" role="img" aria-labelledby="title desc">
  <title id="title">一次 toolCall 递到检查员手里的三种结局</title>
  <desc id="desc">模型发出的 toolCall 先递给扩展的 tool_call 钩子。三种结局：什么都不返回就是放行，execute 照常执行；返回 block:true 就是拦下，工具不执行，reason 作为失败结果回给模型；原地修改 event.input 就是改写，真正执行的是改过的参数。多个扩展依次过检，谁先返回 block，后面的不再被问。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#b9b9b5"/>
    </marker>
  </defs>
  <style>
    .sans{font-family:-apple-system,'PingFang SC','Noto Sans SC',system-ui,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .num{font-size:14px;letter-spacing:2px;font-weight:650;fill:#d9341c}
    .name{font-size:17px;font-weight:650;fill:#111}
    .sub{font-size:14px;fill:#6c6c6c}
    .code{font-size:14px;fill:#555}
    .verdict{font-size:14px;fill:#6c6c6c}
    .verdict-hl{font-size:14px;font-weight:650;fill:#d9341c}
    .ok{font-size:14px;font-weight:650;fill:#2c8a44}
    .note{font-size:14px;fill:#6c6c6c}
    .card{fill:#fff;stroke:#dedede;stroke-width:1.5}
    .gate{fill:#fff;stroke:#ff4d2e;stroke-width:1.5}
    .wire{fill:none;stroke:#c6c6c2;stroke-width:2;stroke-dasharray:0.1 9;stroke-linecap:round;marker-end:url(#arrow)}
    .p1{animation:pulse1 9s linear infinite}
    .p2{animation:pulse2 9s linear infinite}
    .p3{animation:pulse3 9s linear infinite}
    @keyframes pulse1{0%,2%{stroke:#dedede}5%,28%{stroke:#ff4d2e}33%,100%{stroke:#dedede}}
    @keyframes pulse2{0%,35%{stroke:#dedede}38%,61%{stroke:#ff4d2e}66%,100%{stroke:#dedede}}
    @keyframes pulse3{0%,68%{stroke:#dedede}71%,94%{stroke:#ff4d2e}99%,100%{stroke:#dedede}}
    @media(prefers-reduced-motion:reduce){.p1,.p2,.p3{animation:none}}
  </style>

  <g class="sans">
    <rect class="card" x="72" y="188" width="440" height="68"/>
    <text x="94" y="216" class="sub">模型发出的 toolCall</text>
    <text x="94" y="242" class="mono code">bash · { command: "rm -rf build/" }</text>

    <path class="wire" d="M512 222H610"/>

    <rect class="gate" x="618" y="188" width="300" height="68"/>
    <text x="640" y="216" class="name">tool_call 检查员</text>
    <text x="640" y="242" class="sub">你用 pi.on() 挂上的钩子函数</text>

    <path class="wire" d="M768 256V296"/>

    <rect class="card p1" x="72" y="304" width="1046" height="64"/>
    <text x="94" y="331" class="mono num">01</text>
    <text x="134" y="332" class="name">放行</text>
    <text x="94" y="356" class="mono code">什么都不返回</text>
    <text x="420" y="332" class="verdict">→</text>
    <text x="452" y="332" class="ok">execute() 照常执行</text>

    <rect class="card p2" x="72" y="384" width="1046" height="64"/>
    <text x="94" y="411" class="mono num">02</text>
    <text x="134" y="412" class="name">拦下</text>
    <text x="94" y="436" class="mono code">return { block: true, reason: "…" }</text>
    <text x="420" y="412" class="verdict">→</text>
    <text x="452" y="412" class="verdict-hl">工具不执行，reason 作为失败结果回给模型</text>

    <rect class="card p3" x="72" y="464" width="1046" height="64"/>
    <text x="94" y="491" class="mono num">03</text>
    <text x="134" y="492" class="name">改写</text>
    <text x="94" y="516" class="mono code">原地修改 event.input</text>
    <text x="420" y="492" class="verdict">→</text>
    <text x="452" y="492" class="verdict-hl">照常执行，但用的是改过的参数</text>
  </g>

  <text x="72" y="584" class="mono note">多个扩展依次过检：谁先返回 block，后面的检查员不再被问（runner.ts · emitToolCall）</text>
</svg>
