<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pi 扩展层级</title><desc id="desc">Prompt Template、Skill、Extension 和 Package 由轻到重逐层增加能力。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f7f1"/><stop offset="1" stop-color="#eef1f8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".12"/></filter></defs>
  <style>text{font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.title{font-size:41px;font-weight:760;fill:#171a21}.eyebrow{font-size:16px;font-weight:700;letter-spacing:3px;fill:#747a85}.name{font-size:26px;font-weight:740;fill:#181b22}.sub{font-size:17px;fill:#626977}.layer{filter:url(#shadow);animation:lift 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.l2{animation-delay:1.5s}.l3{animation-delay:3s}.l4{animation-delay:4.5s}@keyframes lift{0%,19%,100%{transform:translateY(0)}7%,14%{transform:translateY(-14px)}}@media(prefers-reduced-motion:reduce){.layer{animation:none}}</style>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/><text x="72" y="72" class="eyebrow">EXTEND ONLY AS FAR AS NEEDED</text><text x="72" y="126" class="title">先用最轻的层级解决问题</text>
  <g class="layer" transform="translate(98 214)"><rect width="250" height="300" rx="28" fill="#fff"/><circle cx="52" cy="54" r="19" fill="#9097a2"/><text x="84" y="62" class="name">Prompt</text><text x="32" y="118" class="sub">复用一段输入</text><path d="M32 154h176M32 188h132M32 222h158" stroke="#d9dce2" stroke-width="8" stroke-linecap="round"/><text x="32" y="270" class="sub">只改变“怎么说”</text></g>
  <g class="layer l2" transform="translate(370 190)"><rect width="250" height="324" rx="28" fill="#fff"/><circle cx="52" cy="54" r="19" fill="#4e83ff"/><text x="84" y="62" class="name">Skill</text><text x="32" y="118" class="sub">流程 + 参考 + 脚本</text><rect x="32" y="150" width="186" height="72" rx="14" fill="#eef3ff"/><text x="50" y="180" class="sub">SKILL.md</text><text x="50" y="207" class="sub">scripts / refs</text><text x="32" y="292" class="sub">告诉模型“怎样做”</text></g>
  <g class="layer l3" transform="translate(642 166)"><rect width="250" height="348" rx="28" fill="#171c26"/><circle cx="52" cy="54" r="19" fill="#a875ef"/><text x="84" y="62" style="font:740 26px Inter,system-ui;fill:#fff">Extension</text><text x="32" y="118" style="font:17px Inter,system-ui;fill:#b4bdcd">工具 · 命令 · 事件 · UI</text><path d="m47 174 28 26-28 26M109 226h50" fill="none" stroke="#a875ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="316" style="font:17px Inter,system-ui;fill:#b4bdcd">新增真实程序行为</text></g>
  <g class="layer l4" transform="translate(914 142)"><rect width="188" height="372" rx="28" fill="#fff"/><circle cx="48" cy="54" r="19" fill="#ef7d52"/><text x="79" y="62" class="name">Package</text><text x="28" y="118" class="sub">组合与分发</text><rect x="28" y="156" width="132" height="54" rx="12" fill="#fff1eb"/><rect x="28" y="226" width="132" height="54" rx="12" fill="#eef3ff"/><rect x="28" y="296" width="132" height="54" rx="12" fill="#f4edff"/><text x="49" y="190" class="sub">Prompt</text><text x="67" y="260" class="sub">Skill</text><text x="49" y="330" class="sub">Extension</text></g>
  <path d="M114 588h930" stroke="#aeb2bb" stroke-width="3"/><path d="m1030 576 22 12-22 12" fill="none" stroke="#aeb2bb" stroke-width="3" stroke-linecap="round"/><text x="114" y="628" class="sub">更轻、更容易维护</text><text x="852" y="628" class="sub">能力更强、风险更高</text>
</svg>
