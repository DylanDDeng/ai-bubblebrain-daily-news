<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 中的 Agent 循环</title>
  <desc id="desc">一个任务进入 Turn 后，Harness 组装上下文，请求模型，执行受权限保护的工具，再把观察结果记录到会话；如任务未结束，就开启下一个 Step。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#172554" flood-opacity=".08" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#4e6fff" />
    </marker>
    <style>
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596273; }
      .micro { font: 650 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667085; letter-spacing: .04em; }
      .orbit { fill: none; stroke: #4e6fff; stroke-width: 4; stroke-dasharray: 8 13; animation: dash 2.4s linear infinite; }
      .step { transform-box: fill-box; transform-origin: center; animation: breathe 3.2s ease-in-out infinite; }
      .s2 { animation-delay: -.8s; } .s3 { animation-delay: -1.6s; } .s4 { animation-delay: -2.4s; }
      @keyframes dash { to { stroke-dashoffset: -42; } }
      @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .step { animation: none !important; }
        .motion-dot { display: none; }
      }
    </style>
    <path id="motionPath" d="M600 171 C815 171 951 270 951 389 C951 553 788 632 600 632 C406 632 249 553 249 389 C249 270 385 171 600 171 Z" />
  </defs>

  <rect width="1200" height="760" rx="34" fill="#fbfcff" />
  <text x="60" y="62" class="micro" fill="#4e6fff">TURN CONTAINS ONE OR MORE STEPS</text>
  <text x="60" y="108" class="label" font-size="34">一次模型回答不是 Agent：循环才让它持续完成任务</text>

  <use href="#motionPath" fill="none" stroke="#dde4f5" stroke-width="2" />
  <use href="#motionPath" class="orbit" marker-end="url(#arrowBlue)" />

  <g class="step" filter="url(#shadow)">
    <rect x="435" y="138" width="330" height="112" rx="26" fill="#fff" stroke="#dfe3ec" />
    <circle cx="483" cy="194" r="24" fill="#eef3ff" />
    <text x="483" y="201" class="label" text-anchor="middle" fill="#3157d5">1</text>
    <text x="530" y="186" class="label">组装上下文</text>
    <text x="530" y="216" class="small">目标、历史、提示词、工具 Schema</text>
  </g>

  <g class="step s2" filter="url(#shadow)">
    <rect x="820" y="333" width="310" height="112" rx="26" fill="#111827" />
    <circle cx="868" cy="389" r="24" fill="#3157d5" />
    <text x="868" y="397" class="label" text-anchor="middle" fill="#fff">2</text>
    <text x="915" y="381" class="label" fill="#fff">请求 Model</text>
    <text x="915" y="412" class="small" fill="#d7deed">回答，或选择一个工具</text>
  </g>

  <g class="step s3" filter="url(#shadow)">
    <rect x="435" y="578" width="330" height="112" rx="26" fill="#fff" stroke="#dfe3ec" />
    <circle cx="483" cy="634" r="24" fill="#eef3ff" />
    <text x="483" y="642" class="label" text-anchor="middle" fill="#3157d5">3</text>
    <text x="530" y="626" class="label">执行 Tool</text>
    <text x="530" y="657" class="small">先经过权限、守卫、沙箱和 Hook</text>
  </g>

  <g class="step s4" filter="url(#shadow)">
    <rect x="70" y="333" width="310" height="112" rx="26" fill="#fff" stroke="#dfe3ec" />
    <circle cx="118" cy="389" r="24" fill="#eef3ff" />
    <text x="118" y="397" class="label" text-anchor="middle" fill="#3157d5">4</text>
    <text x="165" y="381" class="label">记录观察</text>
    <text x="165" y="412" class="small">结果写入 Session Event Log</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="600" cy="402" r="122" fill="#eef3ff" stroke="#cbd8ff" stroke-width="2" />
    <text x="600" y="360" class="micro" text-anchor="middle" fill="#3157d5">HARNESS CHECKPOINT</text>
    <text x="600" y="402" class="label" text-anchor="middle">还有工具或输入吗？</text>
    <text x="600" y="440" class="small" text-anchor="middle">有 → 下一个 Step</text>
    <text x="600" y="472" class="small" text-anchor="middle">没有 → 结束 Turn</text>
  </g>

  <circle class="motion-dot" r="10" fill="#4e6fff">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#motionPath" />
    </animateMotion>
  </circle>
  <circle class="motion-dot" r="6" fill="#9db3ff" opacity=".9">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite">
      <mpath href="#motionPath" />
    </animateMotion>
  </circle>

  <text x="60" y="732" class="small">在 DeepSeek Harness 中，Turn 是完整任务边界；每次“请求模型 + 处理工具结果”构成一个 Step。</text>
</svg>
